<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>sd-server 简易生图</title>
<style>
  :root {
    --bg: #16181d;
    --text: #e6e6e6;
    --panel-bg: #1e2128;
    --input-bg: #22252b;
    --border: #333842;
    --label: #9aa0a6;
    --hint: #6b7280;
    --accent: #4a7dff;
    --preview-border: #333;
    --preview-text: #555;
    --badge-bg: #2a2f3a;
    --badge-text: #8b93a0;
    --toggle-bg: #1e2128;
    --toggle-border: #2c303a;
    --toggle-label: #c8ccd4;
    --sidebar-bg: #1a1c22;
    --sidebar-icon: #9aa0a6;
    --sidebar-icon-hover: #e6e6e6;
    --sidebar-icon-bg-hover: #2a2e38;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6f8;
      --text: #1a1d23;
      --panel-bg: #ffffff;
      --input-bg: #f0f2f5;
      --border: #d0d4db;
      --label: #5f6670;
      --hint: #8b919b;
      --accent: #3b6fe0;
      --preview-border: #d0d4db;
      --preview-text: #a0a6b0;
      --badge-bg: #e4e7ec;
      --badge-text: #6b7280;
      --toggle-bg: #ffffff;
      --toggle-border: #d0d4db;
      --toggle-label: #3a3f48;
      --sidebar-bg: #eceef2;
      --sidebar-icon: #6b7280;
      --sidebar-icon-hover: #1a1d23;
      --sidebar-icon-bg-hover: #dfe2e8;
    }
  }

  html[data-theme="light"] {
    --bg: #f5f6f8;
    --text: #1a1d23;
    --panel-bg: #ffffff;
    --input-bg: #f0f2f5;
    --border: #d0d4db;
    --label: #5f6670;
    --hint: #8b919b;
    --accent: #3b6fe0;
    --preview-border: #d0d4db;
    --preview-text: #a0a6b0;
    --badge-bg: #e4e7ec;
    --badge-text: #6b7280;
    --toggle-bg: #ffffff;
    --toggle-border: #d0d4db;
    --toggle-label: #3a3f48;
    --sidebar-bg: #eceef2;
    --sidebar-icon: #6b7280;
    --sidebar-icon-hover: #1a1d23;
    --sidebar-icon-bg-hover: #dfe2e8;
  }

  html[data-theme="dark"] {
    --bg: #16181d;
    --text: #e6e6e6;
    --panel-bg: #1e2128;
    --input-bg: #22252b;
    --border: #333842;
    --label: #9aa0a6;
    --hint: #6b7280;
    --accent: #4a7dff;
    --preview-border: #333;
    --preview-text: #555;
    --badge-bg: #2a2f3a;
    --badge-text: #8b93a0;
    --toggle-bg: #1e2128;
    --toggle-border: #2c303a;
    --toggle-label: #c8ccd4;
    --sidebar-bg: #1a1c22;
    --sidebar-icon: #9aa0a6;
    --sidebar-icon-hover: #e6e6e6;
    --sidebar-icon-bg-hover: #2a2e38;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; min-height: 100vh;
    transition: background 0.2s, color 0.2s;
  }

  /* ---------- 左侧栏：完整竖线，贯穿全高 ---------- */
  .sidebar {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    width: 64px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding: 16px 0 24px;
    gap: 8px;
    z-index: 100;
    transition: background 0.2s, border-color 0.2s;
  }

  .sidebar-btn {
    width: 42px; height: 42px;
    display: flex; align-items: center; justify-content: center;
    border: none; border-radius: 10px;
    background: transparent;
    color: var(--sidebar-icon);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    padding: 0;
  }
  .sidebar-btn:hover {
    background: var(--sidebar-icon-bg-hover);
    color: var(--sidebar-icon-hover);
  }
  .sidebar-btn svg {
    width: 22px; height: 22px;
    display: block;
  }

  /* ---------- 主区域 ---------- */
  .main-area {
    flex: 1;
    padding: 24px;
    padding-left: 88px; /* 为固定侧栏留出空间 */
    display: flex; gap: 24px;
    min-height: 100vh;
  }

  .panel {
    flex: 0 0 440px; display: flex; flex-direction: column; gap: 12px;
    background: var(--panel-bg); padding: 16px; border-radius: 12px;
    border: 1px solid var(--border);
    transition: background 0.2s, border-color 0.2s;
  }

  .preview {
    flex: 1; display: flex; align-items: center; justify-content: center;
    border: 1px dashed var(--preview-border); border-radius: 10px; min-height: 300px;
    color: var(--preview-text); font-size: 14px;
    transition: border-color 0.2s, color 0.2s;
  }
  .preview img { max-width: 100%; max-height: 100%; border-radius: 8px; }

  label { font-size: 13px; color: var(--label); margin-bottom: -6px; }

  input, textarea, button {
    font: inherit; color: var(--text); background: var(--input-bg);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
  }
  textarea { resize: vertical; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }

  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }

  button {
    background: var(--accent); border-color: var(--accent); color: #fff;
    cursor: pointer; font-weight: 600; padding: 10px;
    transition: opacity 0.2s;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .hint { font-size: 12px; color: var(--hint); }
  #status { font-size: 13px; min-height: 18px; color: var(--label); }

  .toggle-group {
    display: flex; gap: 16px; align-items: center;
    background: var(--toggle-bg); border-radius: 8px; padding: 6px 12px;
    border: 1px solid var(--toggle-border);
    transition: background 0.2s, border-color 0.2s;
  }
  .toggle-group label {
    display: flex; align-items: center; gap: 6px;
    color: var(--toggle-label); font-size: 13px; cursor: pointer; margin: 0;
  }
  .toggle-group input[type="checkbox"] {
    width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer;
  }

  .badge {
    font-size: 11px; background: var(--badge-bg); border-radius: 4px;
    padding: 1px 6px; color: var(--badge-text); margin-left: 6px;
  }

  .theme-switcher {
    display: flex; gap: 6px; justify-content: flex-end;
    margin-bottom: 4px;
  }
  .theme-switcher button {
    font-size: 12px; padding: 4px 10px; font-weight: 500;
    background: var(--input-bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; cursor: pointer; flex: 0 0 auto;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
  }
  .theme-switcher button.active {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }

  /* ---------- 弹窗 ---------- */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    opacity: 0; visibility: hidden;
    transition: opacity 0.2s, visibility 0.2s;
  }
  .modal-overlay.show {
    opacity: 1; visibility: visible;
  }
  .modal {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    min-width: 320px; max-width: 400px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    transform: translateY(8px);
    transition: transform 0.2s;
  }
  .modal-overlay.show .modal { transform: translateY(0); }
  .modal-title {
    font-size: 16px; font-weight: 600; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .modal-title svg { width: 20px; height: 20px; color: var(--accent); }
  .modal-body {
    font-size: 14px; color: var(--label); line-height: 1.6;
    margin-bottom: 20px;
  }
  .modal-actions {
    display: flex; justify-content: flex-end;
  }
  .modal-actions button {
    padding: 8px 20px; font-weight: 500; font-size: 14px;
  }
</style>
</head>
<body>

<!-- 左侧栏：完整竖线，图标从下到上：I -> 齿轮 -> >_ -->
<div class="sidebar">
  <button class="sidebar-btn" data-modal="info" title="信息">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="16" x2="12" y2="12"></line>
      <line x1="12" y1="8" x2="12.01" y2="8"></line>
    </svg>
  </button>
  <button class="sidebar-btn" data-modal="settings" title="设置">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </button>
  <button class="sidebar-btn" data-modal="terminal" title="终端">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="4 17 10 11 4 5"></polyline>
      <line x1="12" y1="19" x2="20" y2="19"></line>
    </svg>
  </button>
</div>

<!-- 主区域 -->
<div class="main-area">
  <div class="panel">
    <!-- 主题切换 -->
    <div class="theme-switcher">
      <button data-theme-set="system" class="active">跟随系统</button>
      <button data-theme-set="dark">深色</button>
      <button data-theme-set="light">浅色</button>
    </div>

    <label>服务地址</label>
    <input id="server" value="http://127.0.0.1:1234">

    <label>主提示词 <span class="badge">用户输入</span></label>
    <textarea id="prompt" rows="4"></textarea>

    <label>负面提示词 <span class="badge">用户输入</span></label>
    <textarea id="negative" rows="2"></textarea>

    <!-- 附加默认提示词开关 + 预览 -->
    <div class="toggle-group">
      <label><input type="checkbox" id="useExtraPositive" checked> 启用附加正面提示词</label>
      <label><input type="checkbox" id="useExtraNegative" checked> 启用附加负面提示词</label>
    </div>
    <div class="hint" id="extraPreviewHint"></div>

    <label>LoRA（文件名，相对 --lora-model-dir）</label>
    <div class="row">
      <input id="loraPath" placeholder="your_lora.safetensors">
      <input id="loraWeight" type="number" step="0.05" value="0.8" style="flex:0 0 80px">
    </div>
    <div class="hint">留空则不传 LoRA。每次请求都会固定带上这里的值。</div>

    <div class="row">
      <div>
        <label>宽度</label>
        <input id="width" type="number" value="512">
      </div>
      <div>
        <label>高度</label>
        <input id="height" type="number" value="512">
      </div>
      <div>
        <label>步数</label>
        <input id="steps" type="number" value="12">
      </div>
      <div>
        <label>CFG</label>
        <input id="cfg" type="number" step="0.5" value="2">
      </div>
    </div>

    <button id="go">生成</button>
    <div id="status"></div>
  </div>

  <div class="preview" id="preview">生成结果会显示在这里</div>
</div>

<!-- 弹窗 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-title" id="modalTitle">
      <svg id="modalIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
      <span id="modalTitleText">提示</span>
    </div>
    <div class="modal-body" id="modalBody">该功能尚未完成。</div>
    <div class="modal-actions">
      <button id="modalClose">确定</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const statusEl = $("status");
const previewEl = $("preview");
const goBtn = $("go");

// ---------- 主题控制 ----------
const THEME_KEY = "sd-ui-theme";
const themeButtons = document.querySelectorAll("[data-theme-set]");
const htmlEl = document.documentElement;

function applyTheme(mode) {
  if (mode === "system") {
    htmlEl.removeAttribute("data-theme");
    localStorage.removeItem(THEME_KEY);
  } else {
    htmlEl.setAttribute("data-theme", mode);
    localStorage.setItem(THEME_KEY, mode);
  }
  themeButtons.forEach(btn => {
    btn.classList.toggle("active", btn.dataset.themeSet === mode);
  });
}

const savedTheme = localStorage.getItem(THEME_KEY);
if (savedTheme) {
  applyTheme(savedTheme);
} else {
  applyTheme("system");
}

themeButtons.forEach(btn => {
  btn.addEventListener("click", () => {
    applyTheme(btn.dataset.themeSet);
  });
});

// ---------- 侧栏弹窗 ----------
const modalOverlay = $("modalOverlay");
const modalTitleText = $("modalTitleText");
const modalBody = $("modalBody");
const modalIcon = $("modalIcon");
const modalClose = $("modalClose");

const modalConfigs = {
  info: {
    title: "信息",
    body: "信息功能尚未完成，敬请期待。",
    icon: '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line>'
  },
  settings: {
    title: "设置",
    body: "设置功能尚未完成，敬请期待。",
    icon: '<circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>'
  },
  terminal: {
    title: "终端",
    body: "终端功能尚未完成，敬请期待。",
    icon: '<polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line>'
  }
};

function openModal(type) {
  const cfg = modalConfigs[type];
  if (!cfg) return;
  modalTitleText.textContent = cfg.title;
  modalBody.textContent = cfg.body;
  modalIcon.innerHTML = cfg.icon;
  modalOverlay.classList.add("show");
}

function closeModal() {
  modalOverlay.classList.remove("show");
}

document.querySelectorAll(".sidebar-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    openModal(btn.dataset.modal);
  });
});

modalClose.addEventListener("click", closeModal);
modalOverlay.addEventListener("click", (e) => {
  if (e.target === modalOverlay) closeModal();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && modalOverlay.classList.contains("show")) closeModal();
});

// ---------- 附加默认提示词 ----------
const EXTRA_POSITIVE = "masterpiece, best quality, score_9, score_8, highres, absurdres, newest, year 2026, safe, extremely detailed, highly detailed";
const EXTRA_NEGATIVE = "worst quality, low quality, blurry, jpeg artifacts, signature, watermark, username, text, extra digits, artistic error, bad anatomy, bad hands, missing fingers, extra digit, fewer digits, cropped, worst quality, low quality, normal quality, text, error, blurry, ugly, disfigured, out of frame, extra limbs, malformed limbs, mutated hands, poorly drawn hands, mutated hands, poorly drawn face, mutation, deformed, blurry, bad anatomy, bad proportions, extra limbs, cloned face, disfigured, gross proportions, missing arms, missing legs, extra arms, extra legs, fused fingers, too many fingers, long neck";

function setStatus(msg, isError = false) {
  statusEl.textContent = msg;
  statusEl.style.color = isError ? "#ff6b6b" : "var(--label)";
}

function buildPrompt() {
  const basePrompt = $("prompt").value.trim();
  const baseNegative = $("negative").value.trim();
  const useExtraPos = $("useExtraPositive").checked;
  const useExtraNeg = $("useExtraNegative").checked;

  let finalPositive = basePrompt;
  let finalNegative = baseNegative;

  if (useExtraPos && EXTRA_POSITIVE.length) {
    finalPositive = finalPositive ? `${finalPositive}, ${EXTRA_POSITIVE}` : EXTRA_POSITIVE;
  }
  if (useExtraNeg && EXTRA_NEGATIVE.length) {
    finalNegative = finalNegative ? `${finalNegative}, ${EXTRA_NEGATIVE}` : EXTRA_NEGATIVE;
  }

  return { finalPositive, finalNegative };
}

async function generate() {
  const server = $("server").value.trim().replace(/\/+$/, "");
  const { finalPositive, finalNegative } = buildPrompt();

  if (!finalPositive) {
    setStatus("提示词不能为空（主提示词或附加提示词至少一个）", true);
    return;
  }

  const loraPath = $("loraPath").value.trim();
  const payload = {
    prompt: finalPositive,
    negative_prompt: finalNegative,
    width: parseInt($("width").value) || 512,
    height: parseInt($("height").value) || 512,
    steps: parseInt($("steps").value) || 12,
    cfg_scale: parseFloat($("cfg").value) || 2
  };
  if (loraPath) {
    payload.lora = [{ path: loraPath, multiplier: parseFloat($("loraWeight").value) || 1.0 }];
  }

  goBtn.disabled = true;
  setStatus("正在请求…");

  try {
    if (loraPath) {
      try { await fetch(`${server}/sdapi/v1/loras`); } catch (_) {}
    }

    const resp = await fetch(`${server}/sdapi/v1/txt2img`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (!resp.ok) {
      const text = await resp.text();
      throw new Error(`HTTP ${resp.status}: ${text.slice(0, 300)}`);
    }

    const data = await resp.json();
    const b64 = data.images && data.images[0];
    if (!b64) throw new Error("响应里没有 images 字段");

    previewEl.innerHTML = "";
    const img = document.createElement("img");
    img.src = "data:image/png;base64," + b64;
    previewEl.appendChild(img);
    setStatus("完成");
  } catch (err) {
    setStatus("失败：" + err.message, true);
  } finally {
    goBtn.disabled = false;
  }
}

function updateExtraHint() {
  const usePos = $("useExtraPositive").checked;
  const useNeg = $("useExtraNegative").checked;
  const posPreview = usePos ? "附加正面已启用" : "附加正面已关闭";
  const negPreview = useNeg ? "附加负面已启用" : "附加负面已关闭";
  $("extraPreviewHint").textContent = posPreview + " · " + negPreview;
}

$("useExtraPositive").addEventListener("change", updateExtraHint);
$("useExtraNegative").addEventListener("change", updateExtraHint);
updateExtraHint();

$("width").value = 512;
$("height").value = 512;
$("steps").value = 12;
$("cfg").value = 2;
$("prompt").value = "";
$("negative").value = "";

goBtn.addEventListener("click", generate);
</script>
</body>
</html>
